<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 64" width="340" height="64" fill="none">
  <defs>
    <linearGradient id="portal-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="lens-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="verify-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Mark Container -->
  <g transform="translate(6, 6)">
    <rect width="52" height="52" rx="14" fill="#06080f" stroke="#1c2438" stroke-width="1.5" />
    <!-- Portal Frame -->
    <path d="M 17 38 L 17 16 C 17 12.5 19.5 10 23 10 L 34 10 C 37.5 10 40 12.5 40 16 L 40 20" stroke="url(#portal-dark)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Inspection Lens -->
    <path d="M 35 19 A 10 10 0 1 0 25 37" stroke="url(#lens-dark)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Verification Check -->
    <path d="M 20 27 L 25 32 L 37 19" stroke="url(#verify-dark)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Brand Typography -->
  <text x="72" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="-0.4">
    Inklara
  </text>

  <!-- Subtitle Tagline -->
  <text x="72" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
    Inclusive Engineering Platform
  </text>
</svg>
