<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 64" width="340" height="64" fill="none">
  <defs>
    <linearGradient id="portal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="lens-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="verify-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Mark Container -->
  <g transform="translate(6, 6)">
    <rect width="52" height="52" rx="14" fill="#101322" stroke="#252c48" stroke-width="1.5" />
    <!-- Portal Frame -->
    <path d="M 14 41 L 14 16 C 14 13 16.5 10.5 19.5 10.5 L 36 10.5 C 39 10.5 41.5 13 41.5 16 L 41.5 20.5" stroke="url(#portal-grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Inspection Lens -->
    <path d="M 35 19 A 11.5 11.5 0 1 0 24 39" stroke="url(#lens-grad)" stroke-width="3.2" stroke-linecap="round"/>
    <!-- Verification Check -->
    <path d="M 20 27 L 25 33 L 40 18" stroke="url(#verify-grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Brand Typography -->
  <text x="74" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Inklara
  </text>
  <!-- Platform Badge -->
  <rect x="162" y="18" width="62" height="18" rx="4" fill="#1e1b4b" stroke="#3730a3" stroke-width="1" />
  <text x="171" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#a5b4fc" letter-spacing="0.8">
    PLATFORM
  </text>

  <!-- Subtitle Tagline -->
  <text x="74" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#94a3b8" letter-spacing="0.1">
    Inclusive Engineering &amp; Verification
  </text>
</svg>
