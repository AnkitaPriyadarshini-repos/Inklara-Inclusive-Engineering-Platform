<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow" cx="60%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8" />
      <stop offset="45%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#05070e" />
    </radialGradient>

    <!-- Brand Gradients -->
    <linearGradient id="portal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <linearGradient id="lens-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a5f3fc" />
    </linearGradient>

    <linearGradient id="verify-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Filters -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="mark-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Canvas -->
  <rect width="1200" height="630" fill="url(#bg-glow)" />

  <!-- Architectural Background Grid -->
  <g opacity="0.08" stroke="#6366f1" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="250" y1="0" x2="250" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="550" y1="0" x2="550" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="850" y1="0" x2="850" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
    <line x1="1150" y1="0" x2="1150" y2="630" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="550" x2="1200" y2="550" />
  </g>

  <!-- Left Content Area -->
  <g transform="translate(80, 85)">
    <!-- Top Product Badge -->
    <rect width="320" height="34" rx="17" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.5" />
    <circle cx="20" cy="17" r="4" fill="#38bdf8" />
    <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" letter-spacing="0.5">
      INCLUSIVE ENGINEERING PLATFORM
    </text>

    <!-- Main Headline -->
    <text x="0" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-1">
      Inklara reveals what
    </text>
    <text x="0" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#text-grad)" letter-spacing="-1">
      interfaces leave behind.
    </text>

    <!-- Subtitle -->
    <text x="0" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94a3b8">
      Discover barriers. Understand the evidence. Fix the experience.
    </text>
    <text x="0" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94a3b8">
      Verify every improvement with continuous regression diffing.
    </text>

    <!-- 5 Workflow Stage Pills -->
    <g transform="translate(0, 275)">
      <!-- Stage 1 -->
      <rect x="0" y="0" width="105" height="32" rx="8" fill="#111827" stroke="#374151" />
      <text x="12" y="20" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">01. Discover</text>
      <!-- Arrow -->
      <text x="115" y="20" font-family="sans-serif" font-size="12" fill="#64748b">→</text>
      <!-- Stage 2 -->
      <rect x="135" y="0" width="118" height="32" rx="8" fill="#111827" stroke="#374151" />
      <text x="145" y="20" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">02. Understand</text>
      <!-- Arrow -->
      <text x="263" y="20" font-family="sans-serif" font-size="12" fill="#64748b">→</text>
      <!-- Stage 3 -->
      <rect x="283" y="0" width="112" height="32" rx="8" fill="#111827" stroke="#374151" />
      <text x="295" y="20" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">03. Remediate</text>
      <!-- Arrow -->
      <text x="405" y="20" font-family="sans-serif" font-size="12" fill="#64748b">→</text>
      <!-- Stage 4 -->
      <rect x="425" y="0" width="90" height="32" rx="8" fill="#064e3b" stroke="#059669" />
      <text x="435" y="20" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#34d399">04. Verify</text>
    </g>

    <!-- Bottom Feature Badges -->
    <g transform="translate(0, 360)">
      <text x="0" y="16" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">
        Next.js 15 App Router • React 19 • axe-core 4.10.2 • Playwright • Screen-Reader Workbench • WCAG 2.2 AA
      </text>
      <text x="0" y="42" font-family="monospace" font-size="12" fill="#38bdf8">
        https://inklara.vercel.app • github.com/AnkitaPriyadarshini-repos/Inklara-Inclusive-Engineering-Platform
      </text>
    </g>
  </g>

  <!-- Right Side Product Interface Card Preview -->
  <g transform="translate(680, 100)" filter="url(#card-shadow)">
    <!-- Container Card -->
    <rect width="440" height="430" rx="16" fill="#101322" stroke="#22283d" stroke-width="2" />

    <!-- Window Header -->
    <rect width="440" height="42" rx="16" fill="#0c0e18" />
    <rect width="440" height="1" y="42" fill="#22283d" />
    <circle cx="24" cy="21" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="40" cy="21" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="56" cy="21" r="5" fill="#10b981" opacity="0.8" />
    <text x="80" y="25" font-family="monospace" font-size="11" fill="#64748b">
      inklara-eval // wcag-2.2-audit
    </text>

    <!-- Inklara Vector Symbol in Card -->
    <g transform="translate(25, 65)">
      <!-- Portal Frame -->
      <path
        d="M 18 55 L 18 18 C 18 14 21 11 25 11 L 50 11 C 54 11 57 14 57 18 L 57 24"
        stroke="url(#portal-grad)"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
      />
      <!-- Lens Aperture -->
      <path
        d="M 48 22 A 16 16 0 1 0 32 52"
        stroke="url(#lens-grad)"
        stroke-width="4.5"
        stroke-linecap="round"
        stroke-dasharray="60 12"
        fill="none"
      />
      <!-- Verification Check -->
      <path
        d="M 26 36 L 33 44 L 54 22"
        stroke="url(#verify-grad)"
        stroke-width="5.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
      />
    </g>

    <!-- Card Brand Text -->
    <text x="95" y="88" font-family="-apple-system, sans-serif" font-size="18" font-weight="800" fill="#ffffff">
      Inklara
    </text>
    <rect x="160" y="74" width="60" height="18" rx="4" fill="#1e1b4b" stroke="#4338ca" />
    <text x="168" y="87" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#a5b4fc">
      PLATFORM
    </text>
    <text x="95" y="106" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">
      Active Benchmark Evaluation
    </text>

    <!-- Finding Card 1 -->
    <g transform="translate(24, 135)">
      <rect width="392" height="74" rx="8" fill="#1e2238" stroke="#ef4444" stroke-opacity="0.5" />
      <rect x="12" y="12" width="70" height="20" rx="4" fill="#450a0a" />
      <text x="18" y="26" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#fca5a5">CRITICAL</text>
      <text x="90" y="26" font-family="monospace" font-size="11" font-weight="600" fill="#ffffff">rule: image-alt (WCAG 1.1.1)</text>
      <text x="12" y="48" font-family="monospace" font-size="10" fill="#94a3b8">&lt;img src=&quot;hero.webp&quot;&gt; lacks alt description</text>
      <text x="12" y="64" font-family="-apple-system, sans-serif" font-size="10" font-weight="500" fill="#f87171">Status: OPEN • Screen reader announcement empty</text>
    </g>

    <!-- Finding Card 2 (Verified Fixed) -->
    <g transform="translate(24, 222)">
      <rect width="392" height="74" rx="8" fill="#1e2238" stroke="#10b981" stroke-opacity="0.6" />
      <rect x="12" y="12" width="95" height="20" rx="4" fill="#064e3b" />
      <text x="18" y="26" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#6ee7b7">VERIFIED FIXED</text>
      <text x="115" y="26" font-family="monospace" font-size="11" font-weight="600" fill="#ffffff">color-contrast (WCAG 1.4.3)</text>
      <text x="12" y="48" font-family="monospace" font-size="10" fill="#34d399">Contrast ratio updated: 2.3:1 → 11.2:1 (AAA)</text>
      <text x="12" y="64" font-family="-apple-system, sans-serif" font-size="10" font-weight="500" fill="#6ee7b7">Deterministic SHA-256 fingerprint cleared</text>
    </g>

    <!-- Card Footer Stats -->
    <g transform="translate(24, 310)">
      <rect width="188" height="52" rx="8" fill="#161b2e" />
      <text x="16" y="22" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">COMPLIANCE INDEX</text>
      <text x="16" y="44" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#10b981">94% Passed</text>

      <rect x="204" y="0" width="188" height="52" rx="8" fill="#161b2e" />
      <text x="220" y="22" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">REGRESSIONS</text>
      <text x="220" y="44" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#38bdf8">0 Regressions</text>
    </g>

    <!-- Audit Engine Stamp -->
    <text x="24" y="395" font-family="monospace" font-size="10" fill="#64748b">
      Verified by Playwright Chromium • axe-core 4.10.2
    </text>
  </g>
</svg>
