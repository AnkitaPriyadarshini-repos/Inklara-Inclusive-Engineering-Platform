<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="canvas-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Brand Gradients -->
    <linearGradient id="portal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>

    <linearGradient id="lens-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="verify-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Shadows -->
    <filter id="window-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#0f172a" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>

    <filter id="float-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.14" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
  </style>

  <!-- Clean Canvas Surface -->
  <rect width="1200" height="680" fill="url(#canvas-bg)" />

  <!-- Subtle Architectural Grid Pattern -->
  <g opacity="0.4" stroke="#cbd5e1" stroke-width="0.75" stroke-dasharray="4 8">
    <line x1="80" y1="0" x2="80" y2="680" />
    <line x1="280" y1="0" x2="280" y2="680" />
    <line x1="480" y1="0" x2="480" y2="680" />
    <line x1="680" y1="0" x2="680" y2="680" />
    <line x1="880" y1="0" x2="880" y2="680" />
    <line x1="1080" y1="0" x2="1080" y2="680" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="460" x2="1200" y2="460" />
    <line x1="0" y1="600" x2="1200" y2="600" />
  </g>

  <!-- Top Brand Header Bar -->
  <g transform="translate(60, 36)">
    <!-- Architectural Inklara Logo Mark -->
    <g transform="translate(0, 0)">
      <rect width="40" height="40" rx="10" fill="#0f172a" />
      <path d="M 12 30 L 12 12 C 12 9 14 7 17 7 L 25 7 C 28 7 30 9 30 12 L 30 18" stroke="url(#portal-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 28 17 A 7 7 0 1 0 19 29" stroke="url(#lens-grad)" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 15 22 L 20 27 L 31 16" stroke="url(#verify-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Brand Typography -->
    <text x="52" y="22" class="font-sans" font-size="19" font-weight="800" fill="#0f172a" letter-spacing="-0.5">Inklara</text>
    <text x="122" y="22" class="font-sans" font-size="12" font-weight="600" fill="#64748b">• Inclusive Engineering Platform</text>
    <text x="52" y="37" class="font-sans" font-size="11.5" font-weight="500" fill="#64748b">Continuous WCAG 2.2 AA Verification • Playwright Chromium • axe-core 4.10.2</text>

    <!-- Top Status Badges -->
    <g transform="translate(740, 6)">
      <rect width="130" height="26" rx="13" fill="#ecfdf5" stroke="#a7f3d0" />
      <circle cx="14" cy="13" r="3.5" fill="#10b981" />
      <text x="24" y="17" class="font-sans" font-size="11" font-weight="700" fill="#065f46">WCAG 2.2 Level AA</text>

      <rect x="140" y="0" width="105" height="26" rx="13" fill="#eef2ff" stroke="#c7d2fe" />
      <text x="152" y="17" class="font-sans" font-size="11" font-weight="700" fill="#3730a3">Prisma SQLite / PG</text>

      <rect x="255" y="0" width="85" height="26" rx="13" fill="#f8fafc" stroke="#cbd5e1" />
      <text x="268" y="17" class="font-sans" font-size="11" font-weight="700" fill="#334155">MIT License</text>
    </g>
  </g>

  <!-- Main Window: Snowdog-Style Clean White/Slate Interface -->
  <g transform="translate(60, 96)" filter="url(#window-shadow)">
    <!-- Main Window Background -->
    <rect width="1080" height="520" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />

    <!-- Window Top Chrome -->
    <rect width="1080" height="44" rx="16" fill="#f8fafc" />
    <rect width="1080" height="1" y="44" fill="#e2e8f0" />

    <!-- Subtle Window Dots -->
    <circle cx="24" cy="22" r="4.5" fill="#cbd5e1" />
    <circle cx="38" cy="22" r="4.5" fill="#cbd5e1" />
    <circle cx="52" cy="22" r="4.5" fill="#cbd5e1" />

    <!-- Breadcrumb URL bar -->
    <rect x="74" y="10" width="480" height="24" rx="6" fill="#ffffff" stroke="#e2e8f0" />
    <text x="86" y="26" class="font-mono" font-size="11" fill="#64748b">https://inklara.dev/walkthrough/checkout-portal</text>

    <!-- Right Window Status -->
    <g transform="translate(860, 11)">
      <circle cx="8" cy="11" r="3" fill="#10b981" />
      <text x="18" y="15" class="font-sans" font-size="11" font-weight="600" fill="#475569">Sample Scenario Fixture</text>
    </g>

    <!-- Stage Navigation Stepper (Snowdog Style Tabs) -->
    <g transform="translate(0, 45)">
      <rect width="1080" height="42" fill="#ffffff" />
      <line x1="0" y1="42" x2="1080" y2="42" stroke="#e2e8f0" />

      <!-- Stage 01: Discover -->
      <g transform="translate(32, 0)">
        <text x="0" y="26" class="font-mono" font-size="11" font-weight="700" fill="#94a3b8">01</text>
        <text x="24" y="26" class="font-sans" font-size="13" font-weight="600" fill="#64748b">Discover</text>
      </g>

      <!-- Stage 02: Inspect -->
      <g transform="translate(230, 0)">
        <text x="0" y="26" class="font-mono" font-size="11" font-weight="700" fill="#94a3b8">02</text>
        <text x="24" y="26" class="font-sans" font-size="13" font-weight="600" fill="#64748b">Inspect</text>
      </g>

      <!-- Stage 03: Remediate [Active Tab] -->
      <g transform="translate(430, 0)">
        <rect x="-16" y="0" width="180" height="42" fill="#f8fafc" />
        <text x="0" y="26" class="font-mono" font-size="11" font-weight="800" fill="#4f46e5">03</text>
        <text x="24" y="26" class="font-sans" font-size="13" font-weight="700" fill="#0f172a">Remediate</text>
        <!-- Active underline -->
        <rect x="-16" y="40" width="180" height="2" fill="#4f46e5" />
      </g>

      <!-- Stage 04: Verify -->
      <g transform="translate(670, 0)">
        <text x="0" y="26" class="font-mono" font-size="11" font-weight="700" fill="#94a3b8">04</text>
        <text x="24" y="26" class="font-sans" font-size="13" font-weight="600" fill="#64748b">Verify</text>
      </g>

      <!-- Stage 05: Report -->
      <g transform="translate(870, 0)">
        <text x="0" y="26" class="font-mono" font-size="11" font-weight="700" fill="#94a3b8">05</text>
        <text x="24" y="26" class="font-sans" font-size="13" font-weight="600" fill="#64748b">Report</text>
      </g>
    </g>

    <!-- Active Stage Context Header -->
    <g transform="translate(32, 108)">
      <text x="0" y="18" class="font-sans" font-size="17" font-weight="800" fill="#0f172a">Before &amp; After Code Remediation</text>
      <text x="0" y="36" class="font-sans" font-size="12" fill="#475569">Side-by-side code corrections showing exact HTML/CSS changes with mathematical relative luminance proof.</text>
    </g>

    <!-- Side-by-Side Before & After Grid -->
    <g transform="translate(32, 160)">
      <!-- BEFORE CARD -->
      <g transform="translate(0, 0)">
        <rect width="496" height="205" rx="10" fill="#ffffff" stroke="#fecdd3" stroke-width="1.2" />
        <rect width="496" height="34" rx="10" fill="#fff1f2" />
        <rect width="496" height="1" y="34" fill="#fecdd3" />

        <text x="14" y="22" class="font-sans" font-size="11" font-weight="800" fill="#9f1239">BEFORE: ORIGINAL CODE</text>
        <text x="350" y="22" class="font-mono" font-size="11" font-weight="700" fill="#be123c">Measured: 2.34 : 1 (Fails AA)</text>

        <!-- Code Block -->
        <g transform="translate(14, 46)">
          <rect width="468" height="95" rx="8" fill="#0f172a" />
          <text x="14" y="22" class="font-mono" font-size="10.5" fill="#f43f5e">// Insufficient contrast foreground token</text>
          <text x="14" y="42" class="font-mono" font-size="11" fill="#94a3b8">&lt;<tspan fill="#f43f5e">p</tspan> className=&quot;<tspan fill="#fda4af">checkout-disclaimer text-zinc-400</tspan>&quot;&gt;</text>
          <text x="32" y="60" class="font-mono" font-size="11" fill="#cbd5e1">Please review billing terms carefully...</text>
          <text x="14" y="78" class="font-mono" font-size="11" fill="#94a3b8">&lt;/<tspan fill="#f43f5e">p</tspan>&gt;</text>
        </g>

        <!-- Defect Analysis -->
        <text x="14" y="162" class="font-sans" font-size="11" font-weight="700" fill="#0f172a">Defect Analysis:</text>
        <text x="14" y="180" class="font-sans" font-size="11" fill="#475569">Token #a1a1aa on #f1f5f9 yields 2.34:1 (APCA Lc 46.6), failing WCAG 1.4.3 AA (4.50:1 required).</text>
      </g>

      <!-- AFTER CARD -->
      <g transform="translate(520, 0)">
        <rect width="496" height="205" rx="10" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2" />
        <rect width="496" height="34" rx="10" fill="#ecfdf5" />
        <rect width="496" height="1" y="34" fill="#a7f3d0" />

        <text x="14" y="22" class="font-sans" font-size="11" font-weight="800" fill="#065f46">AFTER: CORRECTED CODE</text>
        <text x="326" y="22" class="font-mono" font-size="11" font-weight="700" fill="#047857">Calculated: 11.20 : 1 (AAA Pass)</text>

        <!-- Code Block -->
        <g transform="translate(14, 46)">
          <rect width="468" height="95" rx="8" fill="#0f172a" />
          <text x="14" y="22" class="font-mono" font-size="10.5" fill="#34d399">// High-luminance compliant foreground token</text>
          <text x="14" y="42" class="font-mono" font-size="11" fill="#94a3b8">&lt;<tspan fill="#34d399">p</tspan> className=&quot;<tspan fill="#a7f3d0">checkout-disclaimer text-slate-100 font-medium</tspan>&quot;&gt;</text>
          <text x="32" y="60" class="font-mono" font-size="11" fill="#f8fafc">Please review billing terms carefully...</text>
          <text x="14" y="78" class="font-mono" font-size="11" fill="#94a3b8">&lt;/<tspan fill="#34d399">p</tspan>&gt;</text>
        </g>

        <!-- Verified Fix Analysis -->
        <text x="14" y="162" class="font-sans" font-size="11" font-weight="700" fill="#0f172a">Verified Solution:</text>
        <text x="14" y="180" class="font-sans" font-size="11" fill="#047857">Token swapped to #f1f5f9 (11.20:1 AAA, APCA Lc 94.4+). Exceeds 4.5:1 AA with zero layout shift.</text>
      </g>
    </g>

    <!-- Bottom Verification Summary Strip -->
    <g transform="translate(32, 380)">
      <rect width="1016" height="52" rx="10" fill="#f8fafc" stroke="#e2e8f0" />
      <circle cx="26" cy="26" r="10" fill="#dcfce7" />
      <path d="M 21 26 L 24 29 L 31 22" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

      <text x="46" y="24" class="font-sans" font-size="12" font-weight="700" fill="#0f172a">
        Contrast Upgraded: 2.34:1 → 11.20:1 (+378% Contrast Ratio Improvement across W3C Formula)
      </text>
      <text x="46" y="40" class="font-sans" font-size="11" fill="#64748b">
        Cryptographic Signature: <tspan class="font-mono">sha256:d8c9f28a...</tspan> marked VERIFIED_FIXED in Playwright re-scan. Zero regressions.
      </text>

      <!-- Action Button -->
      <rect x="860" y="12" width="140" height="28" rx="6" fill="#4f46e5" />
      <text x="880" y="30" class="font-sans" font-size="11" font-weight="700" fill="#ffffff">Verify Fix in DOM →</text>
    </g>

    <!-- Bottom Metadata Bar -->
    <g transform="translate(32, 448)">
      <text x="0" y="24" class="font-sans" font-size="11" font-weight="600" fill="#94a3b8">
        Engine: axe-core 4.10.2 • Playwright 1.49 • W3C WCAG 2.2 AA / AAA • Section 508 • EN 301 549
      </text>
      <text x="800" y="24" class="font-sans" font-size="11" font-weight="600" fill="#64748b">
        Open-Source Inclusive Engineering Platform
      </text>
    </g>
  </g>

  <!-- Floating Feature Card 1: Screen-Reader Workbench Preview -->
  <g transform="translate(860, 470)" filter="url(#float-shadow)">
    <rect width="260" height="135" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <rect width="260" height="28" rx="12" fill="#0f172a" />
    <text x="14" y="19" class="font-sans" font-size="11" font-weight="700" fill="#ffffff">Screen-Reader Workbench</text>
    <rect x="200" y="6" width="48" height="16" rx="8" fill="#10b981" />
    <text x="210" y="17" class="font-sans" font-size="9" font-weight="800" fill="#ffffff">LIVE</text>

    <g transform="translate(14, 40)">
      <circle cx="6" cy="6" r="3" fill="#10b981" />
      <text x="16" y="9" class="font-sans" font-size="10.5" font-weight="600" fill="#0f172a">Modal Dialog Focus Trap</text>
      <text x="180" y="9" class="font-mono" font-size="10" font-weight="700" fill="#16a34a">PASS</text>

      <circle cx="6" cy="28" r="3" fill="#10b981" />
      <text x="16" y="31" class="font-sans" font-size="10.5" font-weight="600" fill="#0f172a">ARIA Live Region Polite</text>
      <text x="180" y="31" class="font-mono" font-size="10" font-weight="700" fill="#16a34a">PASS</text>

      <circle cx="6" cy="50" r="3" fill="#10b981" />
      <text x="16" y="53" class="font-sans" font-size="10.5" font-weight="600" fill="#0f172a">Escape Key Dismissal</text>
      <text x="180" y="53" class="font-mono" font-size="10" font-weight="700" fill="#16a34a">PASS</text>

      <line x1="0" y1="65" x2="232" y2="65" stroke="#f1f5f9" />
      <text x="0" y="80" class="font-mono" font-size="9.5" fill="#64748b">A11y Tree: role=&quot;dialog&quot; modal=true</text>
    </g>
  </g>
</svg>
